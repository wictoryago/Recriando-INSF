<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o Projeto - Instituto Social</title>
    <link rel="icon" type="image/webp" href="../Imagens/Logo.webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Saira+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

<body>
    <div class="donation-container">
        
        <!-- Cabeçalho da página de doação -->
        <div class="donation-header">
            <div class="badge-tag">Contribua com a equipe</div>
            <h1 class="title">Café dos Desenvolvedores ☕</h1>
            <p class="description">
                Gostou do nosso site? Esse projeto foi feito com muito esforço pelos alunos de informática. Se quiser ajudar a pagar o café da equipe, mande um PIX!
            </p>
        </div>

        <!-- Grid com os 3 cards da equipe -->
        <div class="cards-grid">
            
            <!-- Desenvolvedor 1 -->
            <div class="donation-card">
                <h3 class="dev-name">Desenvolvedor 1</h3>
                <div class="pix-section">
                    <label class="pix-label">Chave PIX (CPF/E-mail):</label>
                    <div class="input-group">
                        <input type="text" class="pix-input" value="111.111.111-11" readonly>
                        <button class="btn-copy" onclick="alert('Chave copiada!')">Copiar</button>
                    </div>
                </div>
            </div>

            <!-- Desenvolvedor 2 -->
            <div class="donation-card">
                <h3 class="dev-name">Desenvolvedor 2</h3>
                <div class="pix-section">
                    <label class="pix-label">Chave PIX (CPF/E-mail):</label>
                    <div class="input-group">
                        <input type="text" class="pix-input" value="222.222.222-22" readonly>
                        <button class="btn-copy" onclick="alert('Chave copiada!')">Copiar</button>
                    </div>
                </div>
            </div>

            <!-- Desenvolvedor 3 -->
            <div class="donation-card">
                <h3 class="dev-name">Desenvolvedor 3</h3>
                <div class="pix-section">
                    <label class="pix-label">Chave PIX (CPF/E-mail):</label>
                    <div class="input-group">
                        <input type="text" class="pix-input" value="333.333.333-33" readonly>
                        <button class="btn-copy" onclick="alert('Chave copiada!')">Copiar</button>
                    </div>
                </div>
            </div>

        </div>
        
        <div class="footer-link">
            <a href="../Index.html" class="back-link">Voltar para a página inicial</a>
        </div>
    </div>

</html>
