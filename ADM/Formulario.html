<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="Formulario.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Ruwudu:wght@600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap');
    </style>
    <link rel="icon" type="image/webp" href="../Imagens/Logo.webp">
</head>
<body>

    <header class="Menunu">
        <nav class="Menu">
            <div class="background-blue">
                <img class="logo" src="../Imagens/Logo.webp" alt="Logo Instituto">
                <p>Instituto Social <br>Nossa Senhora de Fátima</p>
            </div>
            <div class="div-botões">
                <a class="btn-vidro" href="../Index.html"><span>Início</span></a>
                <a class="btn-vidro" href="#"><span>Cursos</span></a>
                <a class="btn-vidro" href="#"><span>Ajuda</span></a>
            </div>
            <div class="login-sessao">
                <div><a href="../Login-page-Register/login.html">Entrar</a></div>
                <div><img src="../Imagens/do-utilizador.webp" alt="Usuário"></div>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <section class="form-container-wrapper">
            <div class="form-card">
                <h1 class="tituloo" style="-webkit-text-stroke: 1px #000; text-shadow: none;">Formulário de <span style="color: #EFB653;">Inscrição</span></h1>
                <p class="form-subtitle">Preencha suas informações para concluir sua inscrição na Feira de Profissões</p>
                
                <form action="#" method="POST" class="inscricao-form">
                    
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seusmail@dominio.com" required>
                    </div>

                    <div class="input-group">
                        <label for="como-soube">Como ficou sabendo sobre a Feira?</label>
                        <input type="text" id="como-soube" name="como_soube" placeholder="Familiar/amigo/Redes Sociais">
                    </div>

                    <div class="input-group">
                        <label for="horario">Horário previsto de chegada</label>
                        <input type="text" id="horario" name="horario" placeholder="Digite sua previsão de chegada">
                    </div>

                    <div class="input-group">
                        <label for="curso">Você possui interesse em algum curso?</label>
                        <input type="text" id="curso" name="curso" placeholder="Digite o curso">
                    </div>

                    <div class="input-group">
                        <label for="aluno-frei">Você é ou já foi aluno do Frei?</label>
                        <input type="text" id="aluno-frei" name="aluno_frei" placeholder="Digite sua resposta">
                    </div>

                    <button type="submit" class="botaao btn-enviar">Enviar inscrição</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
